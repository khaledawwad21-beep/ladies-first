services:
  - type: web
    name: ladies-first
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: ./backend/data/ladies-first.sqlite
      - key: CORS_ORIGIN
        value: ""
      - key: PAYMENT_PROVIDER
        value: ""
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ABANDONED_TEMPLATE
        value: ladies_first_abandoned_cart
      - key: WHATSAPP_LOW_STOCK_TEMPLATE
        value: ladies_first_low_stock
