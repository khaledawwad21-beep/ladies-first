<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladies First — لوحة التحكم</title>

<style>
:root{
  --plum:#63345e;
  --pink:#e98eae;
  --cream:#fbf4ec;
  --line:#eadce3;
  --green:#718a57;
  --red:#a33d55;
  --text:#443542;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:var(--plum);
  color:white;
  cursor:pointer;
}

button:hover{opacity:.9}

button.green{background:var(--green)}
button.red{background:var(--red)}
button.pink{background:var(--pink)}
button.gray{background:#777}

input,select,textarea{
  width:100%;
  padding:11px;
  margin:5px 0 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
}

textarea{min-height:100px;resize:vertical}

.top{
  background:var(--plum);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:50;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
}

.nav b{
  font-size:19px;
  margin-left:auto;
}

.nav button{
  background:white;
  color:var(--plum);
}

.wrap{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.box,.login{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px #63345e12;
}

.login{
  max-width:450px;
  margin:70px auto;
}

h1,h2,h3{color:var(--plum)}

.small{
  font-size:12px;
  color:#777;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  padding:18px;
  border-radius:15px;
  background:#f7d8e3;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:8px;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
}

.row>*{flex:1}

.card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  background:#fff;
}

.product{
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:12px;
  align-items:center;
}

.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:12px;
  background:#f5e1e8;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.hidden{display:none}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:9px;
  border-bottom:1px solid var(--line);
  text-align:right;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  font-size:12px;
}

.badge.green{background:#e6f1df;color:#55713f}
.badge.red{background:#f5d9df;color:#8c3048}
.badge.pink{background:#f7d8e3;color:#63345e}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.editBox{
  background:#fff7fa;
  border:1px solid var(--line);
  padding:15px;
  border-radius:14px;
  margin-top:10px;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}
  .product{grid-template-columns:60px 1fr}
  .product img{width:60px;height:60px}
  .product>.actions{grid-column:1/-1}
  .nav b{width:100%;margin:0 0 7px}
}

@media(max-width:500px){
  .grid{grid-template-columns:1fr}
  .row{display:block}
  table{font-size:12px}
}
</style>
</head>

<body>

<div id="top" class="top hidden">
  <div class="nav">
    <b>🌸 Ladies First — لوحة التحكم</b>

    <button onclick="show('dashboard')">📊 الرئيسية</button>
    <button onclick="show('products')">📦 المنتجات</button>
    <button onclick="show('orders')">🛍️ الطلبات</button>
    <button onclick="show('users')">👥 المستخدمون</button>
    <button onclick="show('coupons')">🎟️ الكوبونات</button>
    <button onclick="show('hero')">🖼️ السلايدر</button>
    <button onclick="show('social')">📱 التواصل</button>
    <button onclick="show('automation')">🤖 الأتمتة</button>
    <button id="adminsBtn" onclick="show('admins')">🛡️ الإداريون</button>
    <button onclick="show('settings')">⚙️ الإعدادات</button>
    <button onclick="downloadBackup()">💾 نسخة احتياطية</button>
    <a href="index.html" style="background:white;color:#63345e;padding:10px 14px;border-radius:10px;text-decoration:none">🛒 المتجر</a>
    <button onclick="logout()" class="red">خروج</button>
  </div>
</div>

<div id="app" class="wrap"></div>

<script>

const API_BASE =
  (window.LF_API_BASE ||
   localStorage.getItem('lf_api_base') ||
   location.origin).replace(/\/$/,'');

let currentUser=null;
let products=[];
let users=[];
let orders=[];
let coupons=[];
let settings={};

function token(){
  return sessionStorage.getItem('lf_api_token') ||
         sessionStorage.getItem('lf_admin_token') ||
         '';
}

async function api(path,options={}){
  const headers={
    ...(options.body instanceof FormData ? {} : {'Content-Type':'application/json'}),
    ...(options.headers||{})
  };

  const t=token();
  if(t) headers.Authorization='Bearer '+t;

  const r=await fetch(API_BASE+path,{
    ...options,
    headers,
    cache:'no-store'
  });

  let data={};
  try{data=await r.json()}catch{}

  if(!r.ok){
    throw new Error(data.error||('HTTP_'+r.status));
  }

  return data;
}

function esc(x){
  return String(x??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function money(x){
  return Number(x||0).toFixed(2)+' ₪';
}

function logout(){
  sessionStorage.clear();
  location.reload();
}

/* =========================
   LOGIN / SETUP
========================= */

async function start(){

  try{
    const s=await api('/api/setup/status');

    if(s.setupRequired){
      setupScreen();
      return;
    }

    const t=token();

    if(t){
      try{
        const m=await api('/api/me');
        currentUser=m.user;
        openAdmin();
        return;
      }catch{
        sessionStorage.clear();
      }
    }

    loginScreen();

  }catch(e){
    document.getElementById('app').innerHTML=`
      <div class="login">
        <h2>تعذر الاتصال بالخادم</h2>
        <p>${esc(e.message)}</p>
        <button onclick="start()">إعادة المحاولة</button>
      </div>
    `;
  }
}

function loginScreen(){
  document.getElementById('top').classList.add('hidden');

  document.getElementById('app').innerHTML=`
    <div class="login">
      <h2>🌸 دخول لوحة التحكم</h2>

      <input id="loginEmail"
        type="email"
        placeholder="البريد الإلكتروني">

      <input id="loginPassword"
        type="password"
        placeholder="كلمة المرور">

      <button onclick="login()">دخول</button>
    </div>
  `;
}

async function login(){

  try{

    const r=await api('/api/auth/admin-login',{
      method:'POST',
      body:JSON.stringify({
        email:document.getElementById('loginEmail').value.trim(),
        password:document.getElementById('loginPassword').value
      })
    });

    sessionStorage.setItem('lf_admin_token',r.token);
    sessionStorage.setItem('lf_api_token',r.token);
    sessionStorage.setItem('lf_admin_ok','1');

    currentUser=r.user;

    openAdmin();

  }catch(e){
    alert('بيانات الدخول غير صحيحة أو الحساب غير متاح');
  }
}

function setupScreen(){

  document.getElementById('app').innerHTML=`
    <div class="login">
      <h2>🌸 إعداد المالك لأول مرة</h2>

      <p class="small">
        أنشئي حساب المالك الرئيسي للوحة التحكم.
      </p>

      <input id="setupName" placeholder="اسم المالك">

      <input id="setupEmail"
        type="email"
        placeholder="البريد الإلكتروني">

      <input id="setupPassword"
        type="password"
        placeholder="كلمة المرور — 12 حرفًا على الأقل">

      <button onclick="bootstrap()">إنشاء حساب المالك</button>
    </div>
  `;
}

async function bootstrap(){

  const name=document.getElementById('setupName').value.trim();
  const email=document.getElementById('setupEmail').value.trim();
  const password=document.getElementById('setupPassword').value;

  if(!name||!email||password.length<12){
    return alert('أدخلي البيانات كاملة وكلمة مرور من 12 حرفًا على الأقل');
  }

  try{

    const r=await api('/api/admin/bootstrap',{
      method:'POST',
      body:JSON.stringify({name,email,password})
    });

    sessionStorage.setItem('lf_admin_token',r.token);
    sessionStorage.setItem('lf_api_token',r.token);
    sessionStorage.setItem('lf_admin_ok','1');

    currentUser=r.user;

    openAdmin();

  }catch(e){
    alert('تعذر إنشاء الحساب: '+e.message);
  }
}

/* =========================
   ADMIN
========================= */

async function openAdmin(){

  document.getElementById('top').classList.remove('hidden');

  if(Number(currentUser?.is_owner)!==1){
    document.getElementById('adminsBtn').style.display='none';
  }

  show('dashboard');
}

function clearApp(){
  document.getElementById('app').innerHTML='';
}

function addSection(title,html){
  document.getElementById('app').innerHTML=`
    <div class="box">
      <div class="sectionTitle">
        <h2>${title}</h2>
      </div>
      ${html}
    </div>
  `;
}

async function show(section){

  clearApp();

  try{

    if(section==='dashboard') await dashboard();
    if(section==='products') await productsPage();
    if(section==='orders') await ordersPage();
    if(section==='users') await usersPage();
    if(section==='coupons') await couponsPage();
    if(section==='hero') await heroPage();
    if(section==='social') await socialPage();
    if(section==='automation') await automationPage();
    if(section==='settings') await settingsPage();
    if(section==='admins') await adminsPage();

  }catch(e){

    document.getElementById('app').innerHTML=`
      <div class="box">
        <h2>حدث خطأ</h2>
        <p>${esc(e.message)}</p>
        <button onclick="show('${section}')">إعادة المحاولة</button>
      </div>
    `;
  }
}

/* =========================
   DASHBOARD
========================= */

async function dashboard(){

  const r=await api('/api/admin/dashboard');

  addSection('📊 لوحة المعلومات',`

    <div class="grid">

      <div class="stat">
        مبيعات اليوم
        <b>${money(r.sales)}</b>
      </div>

      <div class="stat">
        الطلبات اليوم
        <b>${r.orders}</b>
      </div>

      <div class="stat">
        متوسط الطلب
        <b>${money(r.averageOrder)}</b>
      </div>

      <div class="stat">
        الربح الإجمالي
        <b>${money(r.grossProfit)}</b>
      </div>

    </div>

    <h3>⚠️ مخزون منخفض</h3>

    ${
      (r.lowStock||[]).length
      ? r.lowStock.map(x=>`
        <div class="card">
          <b>${esc(x.name)}</b>
          <span class="badge ${Number(x.stock)<=0?'red':'pink'}">
            المتبقي: ${x.stock}
          </span>
        </div>
      `).join('')
      : '<p>لا يوجد مخزون منخفض 🎉</p>'
    }
  `);
}

/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

  const r=await api('/api/products?limit=60');
  products=r.products||[];

  return products;
}

async function productsPage(){

  await loadProducts();

  addSection('📦 المنتجات',`

    <div class="actions">
      <button onclick="newProduct()">➕ إضافة منتج</button>
      <button onclick="loadProducts().then(productsPage)">🔄 تحديث</button>
    </div>

    <div id="productEditor"></div>

    <div id="productsList">
      ${
        products.length
        ? products.map(productHTML).join('')
        : '<p>لا توجد منتجات حاليًا.</p>'
      }
    </div>
  `);
}

function productHTML(p){

  const image=p.images?.[0]||'';

  return `
    <div class="card product">

      ${
        image
        ? `<img src="${esc(image)}">`
        : `<div style="width:80px;height:80px;background:#f5e1e8;border-radius:12px;display:grid;place-items:center">🛍️</div>`
      }

      <div>
        <h3>${esc(p.name)}</h3>

        <div>
          <span class="badge">${esc(p.category||'بدون فئة')}</span>
          <span class="badge">${esc(p.brand||'بدون براند')}</span>
        </div>

        <p>
          السعر:
          <b>${money(p.price)}</b>
          &nbsp;
          المخزون:
          <b>${Number(p.stock||0)}</b>
        </p>
      </div>

      <div class="actions">
        <button onclick="editProduct('${esc(p.id)}')">تعديل</button>
      </div>

    </div>
  `;
}

function newProduct(){

  document.getElementById('productEditor').innerHTML=productForm({
    id:'',
    name:'',
    description:'',
    brand:'',
    category:'',
    price:0,
    old_price:'',
    cost_price:0,
    stock:0,
    images:[],
    variants:[],
    active:true
  });
}

function editProduct(id){

  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;

  document.getElementById('productEditor').innerHTML=productForm(p);

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function productForm(p){

  return `
    <div class="editBox">

      <h3>${p.id?'✏️ تعديل المنتج':'➕ منتج جديد'}</h3>

      <input id="p_id" type="hidden" value="${esc(p.id)}">

      <label>اسم المنتج</label>
      <input id="p_name" value="${esc(p.name)}">

      <div class="row">
        <div>
          <label>الفئة</label>
          <input id="p_category" value="${esc(p.category||'')}">
        </div>

        <div>
          <label>البراند</label>
          <input id="p_brand" value="${esc(p.brand||'')}">
        </div>
      </div>

      <div class="row">
        <div>
          <label>السعر</label>
          <input id="p_price" type="number" value="${Number(p.price||0)}">
        </div>

        <div>
          <label>السعر القديم</label>
          <input id="p_old" type="number" value="${p.old_price??''}">
        </div>

        <div>
          <label>التكلفة</label>
          <input id="p_cost" type="number" value="${Number(p.cost_price||0)}">
        </div>
      </div>

      <label>المخزون</label>
      <input id="p_stock" type="number" value="${Number(p.stock||0)}">

      <label>الوصف</label>
      <textarea id="p_description">${esc(p.description||p.desc||'')}</textarea>

      <label>رابط الصورة الرئيسية</label>
      <input id="p_image" value="${esc(p.images?.[0]||'')}" placeholder="https://...">

      <label>
        <input id="p_active" type="checkbox" ${p.active!==false?'checked':''}>
        المنتج فعال
      </label>

      <div class="actions">
        <button onclick="saveProduct()">💾 حفظ</button>
        <button class="gray" onclick="document.getElementById('productEditor').innerHTML=''">إلغاء</button>
      </div>

    </div>
  `;
}

async function saveProduct(){

  const id=document.getElementById('p_id').value.trim();

  const image=document.getElementById('p_image').value.trim();

  const payload={
    id:id||undefined,
    name:document.getElementById('p_name').value.trim(),
    description:document.getElementById('p_description').value.trim(),
    brand:document.getElementById('p_brand').value.trim(),
    category:document.getElementById('p_category').value.trim(),
    price:Number(document.getElementById('p_price').value)||0,
    old_price:Number(document.getElementById('p_old').value)||null,
    cost_price:Number(document.getElementById('p_cost').value)||0,
    stock:Math.max(0,Number(document.getElementById('p_stock').value)||0),
    images:image?[image]:[],
    variants:[],
    active:document.getElementById('p_active').checked,
    metadata:{}
  };

  if(!payload.name){
    return alert('اكتبي اسم المنتج');
  }

  try{

    await api('/api/admin/products',{
      method:'POST',
      body:JSON.stringify(payload)
    });

    alert('تم حفظ المنتج');

    await productsPage();

  }catch(e){
    alert('تعذر حفظ المنتج: '+e.message);
  }
}

/* =========================
   ORDERS
========================= */

async function ordersPage(){

  const r=await api('/api/admin/orders');

  orders=r.orders||[];

  addSection('🛍️ الطلبات',`

    <button onclick="ordersPage()">🔄 تحديث</button>

    <div style="overflow:auto;margin-top:15px">

      <table>

        <thead>
          <tr>
            <th>الطلب</th>
            <th>العميلة</th>
            <th>المجموع</th>
            <th>الحالة</th>
            <th>التاريخ</th>
            <th></th>
          </tr>
        </thead>

        <tbody>

          ${
            orders.map(o=>`

              <tr>

                <td>${esc(o.id)}</td>

                <td>
                  ${esc(o.customer_name||'')}
                  <br>
                  <span class="small">${esc(o.customer_contact||'')}</span>
                </td>

                <td>${money(o.total)}</td>

                <td>
                  <select onchange="changeOrderStatus('${esc(o.id)}',this.value)">
                    ${statusOptions(o.status)}
                  </select>
                </td>

                <td>${esc(o.created_at||'')}</td>

                <td>
                  <button onclick="orderDetails('${esc(o.id)}')">تفاصيل</button>
                </td>

              </tr>

            `).join('')
          }

        </tbody>

      </table>

    </div>

    <div id="orderDetails"></div>
  `);
}

function statusOptions(current){

  const map={
    new:'جديد',
    confirmed:'قيد التجهيز',
    shipped:'قيد الشحن',
    delivered:'تم التوصيل',
    cancelled:'ملغي'
  };

  return Object.entries(map)
    .map(([v,n])=>
      `<option value="${v}" ${v===current?'selected':''}>${n}</option>`
    ).join('');
}

async function changeOrderStatus(id,status){

  try{

    await api('/api/admin/orders/'+encodeURIComponent(id)+'/status',{
      method:'PATCH',
      body:JSON.stringify({status})
    });

    alert('تم تحديث حالة الطلب');

  }catch(e){
    alert('تعذر تحديث الطلب: '+e.message);
  }
}

async function orderDetails(id){

  try{

    const r=await api('/api/admin/orders/'+encodeURIComponent(id));

    document.getElementById('orderDetails').innerHTML=`
      <div class="editBox">

        <h3>تفاصيل الطلب</h3>

        <p><b>الاسم:</b> ${esc(r.order.customer_name)}</p>
        <p><b>التواصل:</b> ${esc(r.order.customer_contact)}</p>
        <p><b>العنوان:</b> ${esc(r.order.customer_address)}</p>
        <p><b>طريقة الدفع:</b> ${esc(r.order.payment_method)}</p>

        <hr>

        ${
          (r.items||[]).map(i=>`
            <div class="card">
              ${esc(i.name_snapshot)}
              × ${i.quantity}
              — ${money(i.price_snapshot)}
            </div>
          `).join('')
        }

        <h3>المجموع: ${money(r.order.total)}</h3>

      </div>
    `;

  }catch(e){
    alert(e.message);
  }
}

/* =========================
   USERS
========================= */

async function usersPage(){

  const r=await api('/api/admin/users');

  users=r.users||[];

  addSection('👥 المستخدمون',`

    <button onclick="usersPage()">🔄 تحديث</button>

    <div style="overflow:auto;margin-top:15px">

      <table>

        <thead>
          <tr>
            <th>الاسم</th>
            <th>التواصل</th>
            <th>الجنس</th>
            <th>العمر</th>
            <th>الدور</th>
            <th></th>
          </tr>
        </thead>

        <tbody>

        ${
          users.map(u=>`

            <tr>

              <td>${esc(u.name)}</td>
              <td>${esc(u.contact)}</td>
              <td>${genderName(u.gender)}</td>
              <td>${u.age??'-'}</td>
              <td>${esc(u.role)}</td>

              <td>
                <button onclick="editUser('${esc(u.id)}')">
                  تعديل
                </button>
              </td>

            </tr>

          `).join('')
        }

        </tbody>

      </table>

    </div>

    <div id="userEditor"></div>
  `);
}

function genderName(g){
  if(g==='male')return 'ذكر';
  if(g==='female')return 'أنثى';
  if(g==='other')return 'آخر';
  return 'غير محدد';
}

function editUser(id){

  const u=users.find(x=>String(x.id)===String(id));
  if(!u)return;

  document.getElementById('userEditor').innerHTML=`
    <div class="editBox">

      <h3>تعديل بيانات المستخدم</h3>

      <input id="u_name" value="${esc(u.name)}">
      <input id="u_contact" value="${esc(u.contact)}">
      <input id="u_email" value="${esc(u.email||'')}">

      <select id="u_gender">
        <option value="female" ${u.gender==='female'?'selected':''}>أنثى</option>
        <option value="male" ${u.gender==='male'?'selected':''}>ذكر</option>

async function saveUser(id){

async function resetUserPassword(id){

async function addCoupon(){

  const code=document.getElementById('couponCode').value.trim();
  const type=document.getElementById('couponType').value;
  const value=Number(document.getElementById('couponValue').value);

  if(!code||!value)return alert('أدخلي الكود والقيمة');

  try{

    await api('/api/admin/coupons',{
      method:'POST',
      body:JSON.stringify({code,type,value})
    });

    await couponsPage();

  }catch(e){
    alert(e.message);
  }
}

async function toggleCoupon(id,active){

  await api('/api/admin/coupons/'+encodeURIComponent(id),{
    method:'PATCH',
    body:JSON.stringify({active:!Boolean(active)})
  });

  await couponsPage();
}

async function deleteCoupon(id){

  if(!confirm('حذف كود الخصم؟'))return;

  await api('/api/admin/coupons/'+encodeURIComponent(id),{
    method:'DELETE'
  });

  await couponsPage();
}

   HERO / SLIDER
========================= */

async function heroPage(){

  const r=await api('/api/admin/settings');

  settings=r.settings||{};

  const hero=settings.hero||{};
  const slides=Array.isArray(settings.hero_slides)
    ?settings.hero_slides:[];

  addSection('🖼️ الشعار والسلايدر',`

    <h3>الشعار</h3>

    <input id="heroLogo"
      value="${esc(hero.logo||'')}"
      placeholder="رابط الشعار">

    <button onclick="saveHero()">💾 حفظ الشعار</button>

    <hr>

    <h3>السلايدر</h3>

    <div id="slides">

      ${
        slides.map((s,i)=>`

          <div class="card">

            <input id="slideImg_${i}"
              value="${esc(s.image||'')}"
              placeholder="رابط الصورة">

            <input id="slideTitle_${i}"
              value="${esc(s.title||'')}"
              placeholder="العنوان">

            <input id="slideText_${i}"
              value="${esc(s.text||'')}"
              placeholder="النص">

            <button class="red" onclick="removeSlide(${i})">
              حذف
            </button>

          </div>

        `).join('')
      }

    </div>

    <button onclick="addSlide()">➕ إضافة سلايد</button>
    <button class="green" onclick="saveSlides()">💾 حفظ السلايدر</button>
  `);
}

async function saveHero(){

  const logo=document.getElementById('heroLogo').value.trim();

  await api('/api/admin/settings/hero',{
    method:'PUT',
    body:JSON.stringify({
      value:{logo,image:logo}
    })
  });

  alert('تم حفظ الشعار');
}

async function addSlide(){

  const r=await api('/api/admin/settings');

  const slides=Array.isArray(r.settings.hero_slides)
    ?r.settings.hero_slides:[ ];

  slides.push({
    image:'',
    title:'',
    text:'',
    link:''
  });

  await api('/api/admin/settings/hero_slides',{
    method:'PUT',
    body:JSON.stringify({value:slides})
  });

  await heroPage();
}

async function removeSlide(i){

  const r=await api('/api/admin/settings');

  const slides=Array.isArray(r.settings.hero_slides)
    ?r.settings.hero_slides:[ ];

  slides.splice(i,1);

  await api('/api/admin/settings/hero_slides',{
    method:'PUT',
    body:JSON.stringify({value:slides})
  });

  await heroPage();
}

async function saveSlides(){

  const r=await api('/api/admin/settings');

  const old=Array.isArray(r.settings.hero_slides)
    ?r.settings.hero_slides:[ ];

  const slides=old.map((s,i)=>({
    ...s,
    image:document.getElementById('slideImg_'+i)?.value.trim()||'',
    title:document.getElementById('slideTitle_'+i)?.value.trim()||'',
    text:document.getElementById('slideText_'+i)?.value.trim()||''
  }));

  await api('/api/admin/settings/hero_slides',{
    method:'PUT',
    body:JSON.stringify({value:slides})
  });

  alert('تم حفظ السلايدر');
}

    method:'DELETE'
  });

  await adminsPage();
}

/* =========================
   BACKUP
========================= */

async function downloadBackup(){

  try{

    const r=await fetch(API_BASE+'/api/admin/backup',{
      headers:{
        Authorization:'Bearer '+token()
      }
    });

    if(!r.ok)throw new Error('BACKUP_FAILED');

    const blob=await r.blob();

    const a=document.createElement('a');

    a.href=URL.createObjectURL(blob);
    a.download='ladies-first-backup.sqlite';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>URL.revokeObjectURL(a.href),1000);

  }catch(e){

    alert('تعذر إنشاء النسخة الاحتياطية: '+e.message);
  }
}
