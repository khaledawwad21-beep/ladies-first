function load(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function productStoragePayload(list){return (Array.isArray(list)?list:[]).map(p=>{const q={...p};delete q.images;return q})}
function setStorageReplacing(k,json){const old=localStorage.getItem(k);try{localStorage.setItem(k,json);return true}catch(e){try{localStorage.removeItem(k);localStorage.setItem(k,json);return true}catch(e2){if(old!==null){try{localStorage.setItem(k,old)}catch(e3){}}return false}}}
function save(k,v){try{const json=JSON.stringify(k==='lf_products'?productStoragePayload(v):v);if(setStorageReplacing(k,json))return true;throw new Error('quota')}catch(e){if(k!=='lf_products'){alert('تعذر حفظ التغييرات. مساحة التخزين في المتصفح ممتلئة.');return false}return false}}
function compressDataUrl(src,opts={}){return new Promise(resolve=>{if(typeof src!=='string'||!src.startsWith('data:image/'))return resolve(src);const r=new Image();r.onload=()=>{try{let w=r.naturalWidth||r.width,h=r.naturalHeight||r.height,maxDim=opts.maxDim||900;if(w>maxDim||h>maxDim){const k=Math.min(maxDim/w,maxDim/h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k))}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{alpha:false});x.drawImage(r,0,0,w,h);let q=.62,d='';const make=()=>{d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q)};make();let guard=0;while(d.length/1024>(opts.targetKB||90)&&q>.3&&guard++<7){q-=.06;make()}resolve(d)}catch(e){resolve(src)}};r.onerror=()=>resolve(src);r.src=src})}
async function compactProductsAndSave(list){const copy=(Array.isArray(list)?list:[]).map(p=>({...p}));for(const p of copy){const a=Array.isArray(p.mainImages)?p.mainImages:[];const b=Array.isArray(p.subImages)?p.subImages:[];p.mainImages=await Promise.all(a.map(x=>compressDataUrl(x)));p.subImages=await Promise.all(b.map(x=>compressDataUrl(x)));delete p.images}products=copy.map(p=>normalizeProductImages(p));const json=JSON.stringify(productStoragePayload(products));if(setStorageReplacing('lf_products',json)){return true}alert('مساحة التخزين ما زالت ممتلئة. احذفي صورة قديمة أو اثنتين ثم أعيدي المحاولة.');return false}
function persistProducts(after){const ok=save('lf_products',products);if(ok){if(after)after();return}Promise.resolve().then(async()=>{const done=await compactProductsAndSave(products);if(done&&after)after()})}

function renameBrand(oldKey){const ar=document.getElementById('brandAr_'+oldKey)?.value.trim();const en=document.getElementById('brandEn_'+oldKey)?.value.trim()||ar;if(!ar)return alert('اكتب اسم البراند');if(ar!==oldKey&&brands[ar])return alert('هذا الاسم موجود لبراند آخر');const b=brands[oldKey]||{};delete brands[oldKey];brands[ar]={...b,ar,en};products.forEach(p=>{if(p.brand===oldKey)p.brand=ar});save('lf_brands',brands);persistProducts(()=>render())}

function compressImage(file,cb,opts={}){const maxDim=opts.maxDim||1000,targetKB=opts.targetKB||120;const reader=new FileReader();reader.onerror=()=>cb('');reader.onload=()=>{const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)return cb('');if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r))}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,w,h);let data='';let quality=.78;const make=()=>{try{data=c.toDataURL('image/webp',quality);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/jpeg',quality)}catch(e){data=''}};make();let guard=0;while(data && data.length/1024>targetKB && quality>.35 && guard++<8){quality-=.06;make()}if(data && data.length/1024>targetKB && w>700){const r=.78;w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);quality=.55;make()}if(data)cb(data);else cb('')}catch(e){cb('')}};img.onerror=()=>cb('');img.src=reader.result};reader.readAsDataURL(file)}
async function uploadDataUrl(data){
  if(!data)return '';
  const token=apiToken?.()||sessionStorage.getItem('lf_admin_token')||'';
  const m=String(data).match(/^data:([^;]+);base64,(.+)$/); if(!m)return data;
  const bin=atob(m[2]); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const blob=new Blob([bytes],{type:m[1]}); const fd=new FormData(); fd.append('image',blob,'upload.webp');
  const r=await fetch((window.LF_API_BASE||localStorage.getItem('lf_api_base')||(location.protocol==='file:'?'http://localhost:3000':location.origin)).replace(/\/$/,'')+'/api/admin/uploads/image',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{},body:fd});
  let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.error||'UPLOAD_FAILED'); return d.url||data;
}
function readImages(input,cb){const fs=[...(input.files||[])];if(!fs.length)return cb([]);const out=new Array(fs.length);let left=fs.length;fs.forEach((f,i)=>compressImage(f,async data=>{try{out[i]=await uploadDataUrl(data)}catch(e){console.warn(e);out[i]=''}if(--left===0){cb(out.filter(Boolean));input.value=''}}))}
function readOne(input,cb){const f=input.files?.[0];if(!f)return;compressImage(f,async data=>{try{cb(await uploadDataUrl(data))}catch(e){alert('تعذر رفع الصورة: '+e.message)}input.value=''},{maxDim:1400,targetKB:320})}

async function stockDeltaForOrder(o,sign){
  if(!o||!Array.isArray(o.items))return true;
  try{
    let touched=false;
    o.items.forEach(it=>{
      const pid=it.productId ?? it.id ?? it.product_id;
      const p=products.find(x=>String(x.id)===String(pid));
      if(!p)return;
      const qty=Math.max(0,Number(it.qty)||0),vs=variantList(p);
      if(vs.length){
        const wanted=it.variant ?? it.color ?? it.colour ?? it.option ?? it.variantName ?? '';
        const v=p.variants.find(x=>String(x.name)===String(wanted));
        if(v){v.stock=Math.max(0,(Number(v.stock)||0)+sign*qty);touched=true;}
        else if(!wanted){
          // Legacy orders without a saved variant: fall back to the first matching stock bucket only when there is one.
          if(vs.length===1){vs[0].stock=Math.max(0,(Number(vs[0].stock)||0)+sign*qty);touched=true;}
        }
        p.stock=totalStock(p);
      }else{
        p.stock=Math.max(0,(Number(p.stock)||0)+sign*qty);touched=true;
      }
    });
    if(!touched) throw new Error('لم يتم العثور على منتجات الطلب داخل المخزون');
    if(save('lf_products',products))return true;
    // Stock changes must still work when the product images make localStorage full.
    const done=await compactProductsAndSave(products);
    if(!done)throw new Error('تعذر حفظ المخزون');
    return true;
  }catch(e){
    alert('لم يتم تغيير حالة الطلب: '+(e?.message||'تعذر حفظ المخزون')+'\n\nتأكدي أن المنتجات الموجودة في الطلب ما زالت موجودة.');
    return false;
  }
}

async function status(id,v){
  const o=orders.find(x=>String(x.id)===String(id));if(!o)return;
  const from=o.status||'جديد';if(from===v)return;
  if(!o.inventoryState)o.inventoryState=from==='ملغي'?'restored':'deducted';
  let inventoryChanged=false,delta=0;
  if(v==='ملغي'&&from!=='ملغي'&&o.inventoryState!=='restored'){delta=+1;inventoryChanged=true;}
  if(from==='ملغي'&&v!=='ملغي'&&o.inventoryState!=='deducted'){delta=-1;inventoryChanged=true;}
  if(inventoryChanged){
    const ok=await stockDeltaForOrder(o,delta);
    if(!ok){render();return;}
  }
  const oldState=o.inventoryState,oldStatus=o.status,oldRestored=o.inventoryRestoredAt,oldCancelled=o.cancelledAt;
  if(v==='ملغي'){
    o.inventoryState='restored';o.inventoryRestoredAt=Date.now();o.cancelledAt=Date.now();
  }else if(from==='ملغي'){
    o.inventoryState='deducted';o.inventoryRestoredAt=null;o.cancelledAt=null;
  }
  o.status=v;o.statusUpdatedAt=Date.now();
  if(!save('lf_orders',orders)){
    if(inventoryChanged)await stockDeltaForOrder(o,-delta);
    o.inventoryState=oldState;o.status=oldStatus;o.inventoryRestoredAt=oldRestored;o.cancelledAt=oldCancelled;
    render();return;
  }
  logOrderEvent(o.id,from,v,v==='ملغي'?'تم إلغاء الطلب وإرجاع الكميات للمخزون واستبعاده من الحسابات والمبيعات':from==='ملغي'?'إعادة تفعيل الطلب وخصم الكميات من المخزون وإعادته للحسابات':'تغيير حالة الطلب');
  render();
}

function getReportData(){const from=document.getElementById('reportFrom')?.value||'',to=document.getElementById('reportTo')?.value||'';const f=from?new Date(from+'T00:00:00').getTime():0;const t=to?new Date(to+'T23:59:59').getTime():Infinity;const allInRange=orders.filter(o=>reportTimestamp(o)>=f&&reportTimestamp(o)<=t);const list=allInRange.filter(o=>o.status!=='ملغي');let sales=0,cost=0,shipping=0,qty=0;const byProduct={};list.forEach(o=>{sales+=Number(o.total)||0;shipping+=Number(o.shippingFee)||0;(o.items||[]).forEach(it=>{const q=Number(it.qty)||0;qty+=q;cost+=(Number(it.cost)||0)*q;const key=String(it.productId||it.name);if(!byProduct[key])byProduct[key]={name:it.name||'منتج',qty:0,sales:0,cost:0};byProduct[key].qty+=q;byProduct[key].sales+=Number(it.lineTotal)||0;byProduct[key].cost+=(Number(it.cost)||0)*q})});const events=load('lf_order_events',[]).filter(e=>Number(e.timestamp||0)>=f&&Number(e.timestamp||0)<=t);const cancelled=allInRange.filter(o=>o.status==='ملغي');const completed=allInRange.filter(o=>o.status==='تم التوصيل');const active=allInRange.filter(o=>o.status!=='ملغي');const gross=sales-cost;return {list,allInRange,sales,cost,shipping,qty,gross,byProduct,events,cancelled,completed,active}}

function renderDatePicker(){const head=document.getElementById('datePickerMonth'),grid=document.getElementById('datePickerGrid');if(!head||!grid)return;const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];head.textContent=`${names[pickerMonth.getMonth()]} ${pickerMonth.getFullYear()}`;const y=pickerMonth.getFullYear(),m=pickerMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();let start=(first.getDay()+1)%7;let html='';for(let i=0;i<start;i++)html+='<span></span>';const today=isoDateLocal(new Date()),selected=document.getElementById(activeDateField)?.value||'';for(let d=1;d<=days;d++){const iso=isoDateLocal(new Date(y,m,d));const cls=[iso===today?'today':'',iso===selected?'selected':''].filter(Boolean).join(' ');html+=`<button type="button" class="${cls}" onclick="pickDateDay(${d})">${d}</button>`}grid.innerHTML=html}

function socialAdminHtml(){const x=getSocialAdmin();return `<div class="box anchor adminCollapsible" id="socialSection"><h2>📱 التواصل معنا</h2><p class="small">أضيفي رابط كل صفحة. واتساب مثبت على الرقم المعتمد 0562499924 ويمكن تعديل الرابط مستقبلًا.</p>${Object.entries(x).map(([k,v])=>`<div class="socialAdminRow" data-social="${k}"><div class="socialAdminIcon"><i class="${esc(v.icon)}"></i></div><input class="socialLabel" value="${esc(v.label)}" placeholder="اسم المنصة"><input class="socialUrl" value="${esc(v.url||'')}" placeholder="رابط الصفحة — مثال https://..."><label><input class="socialEnabled" type="checkbox" ${v.enabled!==false?'checked':''}> إظهار في الشريط الجانبي</label></div>`).join('')}<button class="green" onclick="saveSocialAdmin()">💾 حفظ روابط التواصل</button></div>`}
function getRegisteredUsers(){let users=load('lf_users',[]);const current=load('lf_account',null);if(current&&!users.some(u=>String(u.contact||'').toLowerCase()===String(current.contact||'').toLowerCase()&&u.type===current.type)){users=[{...current,id:Date.now(),updatedAt:Date.now()},...users];save('lf_users',users)}return Array.isArray(users)?users:[]}
function resetUserPassword(id){const users=getRegisteredUsers(),u=users.find(x=>String(x.id)===String(id));if(!u)return;const temp='LF'+Math.floor(100000+Math.random()*900000);u.password=temp;u.updatedAt=Date.now();save('lf_users',users);const a=load('lf_account',null);if(a&&String(a.id||'')===String(u.id))save('lf_account',{...a,password:temp});alert(`تم إصدار كلمة مرور مؤقتة للمستخدم ${u.name||''}:\n${temp}\nأرسليها له بشكل آمن.`);render()}
function updateRegisteredUser(id){const users=getRegisteredUsers(),u=users.find(x=>String(x.id)===String(id));if(!u)return;const name=document.getElementById('userName_'+id)?.value.trim(),contact=document.getElementById('userContact_'+id)?.value.trim(),gender=document.getElementById('userGender_'+id)?.value||'female',age=Math.max(13,Math.min(120,Number(document.getElementById('userAge_'+id)?.value)||0));if(!name||!contact||!age)return alert('يرجى تعبئة الاسم ووسيلة التواصل والعمر');u.name=name;u.contact=contact;u.gender=gender;u.age=age;u.updatedAt=Date.now();save('lf_users',users);const a=load('lf_account',null);if(a&&String(a.id||'')===String(u.id))save('lf_account',{...a,name,contact,gender,age,updatedAt:u.updatedAt});alert('تم حفظ بيانات المستخدم بنجاح');render()}

const me=await apiFetch('/api/me');currentAdminUser=me.user;if(Number(currentAdminUser.is_owner)!==1){nav.style.display='none';return}nav.style.display='inline-flex';const sec=document.getElementById('adminsSection');if(!sec)return;const r=await apiFetch('/api/admin/admins');const admins=r.admins||[];const list=document.getElementById('adminsList');list.innerHTML=admins.map(a=>{const p=a.permissions||{};const owner=Number(a.is_owner)===1;return `<div class="userAdmin"><div class="userHead"><div class="grow"><b>${esc(a.name)}</b> ${owner?'<span class="visaBadge">OWNER</span>':(Number(a.active)?'<span class="stockBadge">فعال</span>':'<span class="soldAdminBadge">معطل</span>')}<div class="muted">${esc(a.email||a.contact)}</div></div></div>${owner?'<p class="small">هذا حساب المالك — جميع الصلاحيات مفعلة ولا يمكن حذفه من الإداريين.</p>':`<div class="userEditGrid"><input id="admEditName_${a.id}" value="${esc(a.name)}" placeholder="الاسم"><input id="admEditContact_${a.id}" value="${esc(a.contact)}" placeholder="وسيلة التواصل"><input id="admEditEmail_${a.id}" value="${esc(a.email||'')}" placeholder="البريد"><input id="admEditPassword_${a.id}" type="password" placeholder="اتركيه فارغًا دون تغيير كلمة المرور"></div><div class="permGrid">${ADMIN_PERMS.map(([k,l])=>`<label><input type="checkbox" id="admPerm_${a.id}_${k}" ${p[k]===true?'checked':''}> ${l}</label>`).join('')}</div><div class="userActions"><button class="green" onclick="saveAdminUser('${a.id}')">💾 حفظ الإداري</button><button class="danger" onclick="disableAdminUser('${a.id}')">${Number(a.active)?'تعطيل الحساب':'تفعيل الحساب'}</button></div>`}</div>`}).join('')||'<p>لا يوجد إداريون.</p>';}catch(e){console.warn(e.message)}}

async function createAdminUser(){const name=document.getElementById('admName')?.value.trim(),contact=document.getElementById('admContact')?.value.trim(),email=document.getElementById('admEmail')?.value.trim(),password=document.getElementById('admPassword')?.value||'';if(!name||!contact||!email||password.length<8)return alert('أكملي الاسم ووسيلة التواصل والإيميل وكلمة مرور من 8 أحرف على الأقل');const permissions={};for(const [k] of ADMIN_PERMS)permissions[k]=!!document.getElementById('newPerm_'+k)?.checked;if(sessionStorage.getItem('lf_local_admin_mode')==='1'){const a=localAdmins();if(a.some(x=>String(x.email).toLowerCase()===email.toLowerCase()))return alert('هذا البريد مستخدم بالفعل');const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now());const hash=await hashLocalPassword(password,salt);a.push({id:'local-admin-'+Date.now()+Math.random().toString(36).slice(2,7),name,contact,email,salt,hash,permissions,active:true,createdAt:Date.now()});saveLocalAdmins(a);alert('تم إنشاء حساب الموظف وصلاحياته محليًا');['admName','admContact','admEmail','admPassword'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});await loadAdminManagement();return}try{await apiFetch('/api/admin/admins',{method:'POST',body:JSON.stringify({name,contact,email,password,permissions})});alert('تم إنشاء الحساب الإداري');document.getElementById('admName').value='';document.getElementById('admContact').value='';document.getElementById('admEmail').value='';document.getElementById('admPassword').value='';await loadAdminManagement()}catch(e){alert('تعذر إنشاء الحساب: '+e.message)}}
async function saveAdminUser(id){const body={name:document.getElementById('admEditName_'+id)?.value.trim(),contact:document.getElementById('admEditContact_'+id)?.value.trim(),email:document.getElementById('admEditEmail_'+id)?.value.trim(),permissions:{}};for(const [k] of ADMIN_PERMS)body.permissions[k]=!!document.getElementById('admPerm_'+id+'_'+k)?.checked;const pw=document.getElementById('admEditPassword_'+id)?.value||'';if(sessionStorage.getItem('lf_local_admin_mode')==='1'){const a=localAdmins(),i=a.findIndex(x=>String(x.id)===String(id));if(i<0)return;if(body.email&&a.some((x,j)=>j!==i&&String(x.email).toLowerCase()===body.email.toLowerCase()))return alert('هذا البريد مستخدم بالفعل');Object.assign(a[i],{name:body.name,contact:body.contact,email:body.email,permissions:body.permissions});if(pw){if(pw.length<8)return alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');a[i].salt=crypto.randomUUID?crypto.randomUUID():String(Date.now());a[i].hash=await hashLocalPassword(pw,a[i].salt)}saveLocalAdmins(a);alert('تم حفظ بيانات وصلاحيات الموظف');await loadAdminManagement();return}try{if(pw)body.password=pw;await apiFetch('/api/admin/admins/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});alert('تم حفظ صلاحيات الإداري');await loadAdminManagement()}catch(e){alert('تعذر الحفظ: '+e.message)}}
async function disableAdminUser(id){if(!confirm('هل تريد تغيير حالة حساب هذا الموظف؟'))return;if(sessionStorage.getItem('lf_local_admin_mode')==='1'){const a=localAdmins(),i=a.findIndex(x=>String(x.id)===String(id));if(i<0)return;a[i].active=a[i].active===false;saveLocalAdmins(a);await loadAdminManagement();return}try{const r=await apiFetch('/api/admin/admins');const a=(r.admins||[]).find(x=>String(x.id)===String(id));if(!a)return;await apiFetch('/api/admin/admins/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({active:!Number(a.active)})});await loadAdminManagement()}catch(e){alert('تعذر تغيير حالة الحساب: '+e.message)}}

n></select></label><label>نقاط لكل طلب<input id="pointsPerOrder" type="number" min="0" step="1" value="${Number(p.pointsPerOrder)||10}"></label><label>كل كم ₪ = نقاط؟<input id="amountPerPoint" type="number" min="0.01" step="0.01" value="${Number(p.amountPerPoint)||10}"></label><label>عدد النقاط لكل وحدة<input id="pointsPerAmount" type="number" min="1" step="1" value="${Number(p.pointsPerAmount)||1}"></label><label>قيمة النقطة بالشيكل<input id="pointValue" type="number" min="0" step="0.01" value="${Number(p.pointValue)||0.1}"></label><label><input id="pointsRedeemEnabled" type="checkbox" ${p.redeemEnabled!==false?'checked':''}> السماح باستبدال النقاط بخصم</label><label>تحتسب النقاط عند<select id="pointsAwardOn"><option value="delivered" ${p.awardOn!=='placed'?'selected':''}>تسليم الطلب</option><option value="placed" ${p.awardOn==='placed'?'selected':''}>إنشاء الطلب</option></select></label></div><p class="small">مثال: إذا اخترتِ كل 10 ₪ = نقطة، فالطلب 100 ₪ يمنح 10 نقاط. وإذا كانت قيمة النقطة 0.10 ₪ فـ100 نقطة = 10 ₪.</p><button class="green" onclick="saveLoyaltySettings()">💾 حفظ إعدادات النقاط</button></div></div>`}

async function persistProducts(after){try{
  for(const p of products){
    normalizeProductImages(p);
    for(const field of ['mainImages','subImages']){
      const arr=Array.isArray(p[field])?p[field]:[];
      for(let i=0;i<arr.length;i++) if(String(arr[i]).startsWith('data:image/')) arr[i]=await uploadDataUrl(arr[i]);
    }
    p.images=[...(p.mainImages||[]),...(p.subImages||[])];
    await apiFetch('/api/admin/products',{method:'POST',body:JSON.stringify(apiProductPayload(p))});
  }
  save('lf_products',products);if(after)after()
}catch(e){alert('تعذر مزامنة المنتج مع الخادم: '+e.message)}}

async function hashLocalPassword(password,salt){const data=new TextEncoder().encode(String(salt)+'|'+String(password));const buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function createLocalOwner(){const name=document.getElementById('setupName')?.value.trim(),email=document.getElementById('setupEmail')?.value.trim(),password=document.getElementById('setupPassword')?.value||'',confirm=document.getElementById('setupPassword2')?.value||'';if(!name||!email||password.length<12)return alert('أدخل الاسم والإيميل وكلمة مرور من 12 حرفًا على الأقل');if(password!==confirm)return alert('كلمتا المرور غير متطابقتين');const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now());const hash=await hashLocalPassword(password,salt);localStorage.setItem('lf_local_owner',JSON.stringify({name,email,salt,hash,createdAt:Date.now()}));await localRender();}

async function localResetOwner(){const owner=localOwner();const email=document.getElementById('resetEmail')?.value.trim(),password=document.getElementById('resetPassword')?.value||'',confirm=document.getElementById('resetPassword2')?.value||'';if(!owner||email.toLowerCase()!==String(owner.email||'').toLowerCase())return alert('البريد الإلكتروني غير مطابق لحساب المالك');if(password.length<12)return alert('كلمة المرور يجب أن تكون 12 حرفًا على الأقل');if(password!==confirm)return alert('كلمتا المرور غير متطابقتين');const salt=crypto.randomUUID?crypto.randomUUID():String(Date.now());owner.salt=salt;owner.hash=await hashLocalPassword(password,salt);localStorage.setItem('lf_local_owner',JSON.stringify(owner));alert('تم تغيير كلمة مرور المالك');await localLoginScreen();}

async function ensureLogin(){
  const token=apiToken()||sessionStorage.getItem('lf_admin_token')||'';
  if(token && token!=='local-owner'){
    try{await apiFetch('/api/me');await render();return}
    catch(e){sessionStorage.removeItem('lf_admin_ok');sessionStorage.removeItem('lf_admin_token')}
  }
  if(sessionStorage.getItem('lf_local_admin_mode')==='1' && localOwner()){await localRender();return}
  try{
    const r=await fetch(API_BASE+'/api/setup/status',{cache:'no-store'});
    if(!r.ok)throw new Error('SETUP_STATUS_FAILED');
    const s=await r.json();
    if(s.setupRequired){await setupScreen();return}
    await login();
  }catch(e){
    if(localOwner()) localLoginScreen(); else localSetupScreen();
  }
}
async function loadAdminNotifications(){try{const d=await apiFetch('/api/admin/notifications');const n=d.notifications||[];const badge=document.getElementById('adminNotifBadge');if(badge)badge.textContent=n.length?`(${n.length})`:'';const box=document.getElementById('adminNotifications');if(box)box.innerHTML=n.length?n.map(x=>`<div class="order"><b>${esc(x.title)}</b><div class="small">${esc(x.message)}</div></div>`).join(''):'<p>لا توجد تنبيهات.</p>';}catch(e){console.warn('notifications',e.message)}}
async function downloadBackup(){try{const token=sessionStorage.getItem('lf_admin_token')||'';const base=(window.LF_API_BASE||localStorage.getItem('lf_api_base')||(location.protocol==='file:'?'http://localhost:3000':location.origin)).replace(/\/$/,'');const r=await fetch(base+'/api/admin/backup',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('BACKUP_FAILED');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ladies-first-backup.sqlite';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('تعذر إنشاء النسخة الاحتياطية: '+e.message)}}

async function render(){try{const me=await apiFetch('/api/me');currentAdminUser=me.user;if(!document.getElementById('adminTools')){const x=document.createElement('div');x.id='adminTools';x.style.cssText='position:fixed;bottom:18px;left:18px;z-index:9999;display:flex;gap:8px;align-items:center';x.innerHTML='<button onclick="downloadBackup()">💾 نسخة احتياطية</button><button onclick="toggleAdminPanel(\'adminNotifications\')">🔔 <span id="adminNotifBadge"></span></button>';document.body.appendChild(x);const b=document.createElement('div');b.id='adminNotifications';b.className='box adminCollapsible';b.style.cssText='position:fixed;bottom:72px;left:18px;z-index:9998;width:min(360px,calc(100vw - 36px));max-height:55vh;overflow:auto;background:#fff';document.body.appendChild(b)}const localProducts=load('lf_products',[]);const probe=await apiFetch('/api/products');if(!(probe.products||[]).length&&localProducts.length){for(const p of localProducts)await apiFetch('/api/admin/products',{method:'POST',body:JSON.stringify(apiProductPayload(p))})}await syncAdminSettings();await syncAdminData();await syncAdminWaitlist();legacyRender();await loadAdminManagement()}catch(e){console.warn(e);if(!sessionStorage.getItem('lf_admin_token'))login();else alert('تعذر الاتصال بالخادم: '+e.message)}}
