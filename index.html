const DEFAULT_HERO={logo:LOGO,image:LOGO};
function load(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function productStoragePayload(list){return (Array.isArray(list)?list:[]).map(p=>{const q={...p};delete q.images;return q})}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(k==='lf_products'?productStoragePayload(v):v));return true}catch(e){try{localStorage.removeItem(k);localStorage.setItem(k,JSON.stringify(k==='lf_products'?productStoragePayload(v):v));return true}catch(e2){return false}}}
function normalizeProductImages(p){if(!p)return p;const mains=Array.isArray(p.mainImages)?p.mainImages.filter(Boolean):((p.images||[]).filter(Boolean).slice(0,1));const subs=Array.isArray(p.subImages)?p.subImages.filter(Boolean):((p.images||[]).filter(Boolean).slice(1));p.mainImages=mains;p.subImages=subs;p.images=[...mains,...subs];return p}
function mainImagesOf(p){return normalizeProductImages(p).mainImages||[]}
function subImagesOf(p){return normalizeProductImages(p).subImages||[]}
let products=load('lf_products',INITIAL_PRODUCTS),cats=load('lf_cats',INITIAL_CATS),brands=load('lf_brands',{}),cart=load('lf_cart',[]),heroSettings=load('lf_hero',DEFAULT_HERO); products=products.map(p=>normalizeProductImages({...p,brand:p.brand||'',stock:(p.stock===undefined?10:Math.max(0,Number(p.stock)||0))})); save('lf_products',products); save('lf_brands',brands);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeImg(src,fallback=LOGO){return (typeof src==='string'&&src.trim())?src:fallback}
function renderHero(){heroSettings=load('lf_hero',DEFAULT_HERO)||DEFAULT_HERO;const logo=document.getElementById('logo'),hero=document.getElementById('heroLogo'),side=document.getElementById('sideLogo');if(logo){logo.src=safeImg(heroSettings.logo);logo.onerror=()=>{logo.onerror=null;logo.src=LOGO}}if(hero){hero.src=safeImg(heroSettings.image);hero.onerror=()=>{hero.onerror=null;hero.src=LOGO}}if(side){side.src=safeImg(heroSettings.logo);side.onerror=()=>{side.onerror=null;side.src=LOGO}}}
function renderCats(){const keys=Object.keys(cats);const countBy={};products.forEach(p=>countBy[p.cat]=(countBy[p.cat]||0)+1);const catsEl=document.getElementById('cats');if(catsEl)catsEl.innerHTML=keys.map(k=>{const c=cats[k]||{};return `<button class="cat" onclick="setCat('${esc(k).replace(/'/g,"\'")}')"><img src="${safeImg(c.image,LOGO)}" onerror="this.onerror=null;this.src='${LOGO}'"><label>${esc(currentLang==='en'?(c.en||c.ar||k):(c.ar||k))}</label></button>`}).join('');const filter=document.getElementById('filter');if(filter)filter.innerHTML=`<option value="">${currentLang==='en'?'All categories':'كل الفئات'}</option>`+keys.map(k=>`<option value="${esc(k)}">${esc(currentLang==='en'?(cats[k]?.en||cats[k]?.ar||k):(cats[k]?.ar||k))}</option>`).join('');const bf=document.getElementById('brandFilter');if(bf)bf.innerHTML=`<option value="">${currentLang==='en'?'All brands':'كل البراندات'}</option>`+Object.keys(brands).map(k=>`<option value="${esc(k)}">${esc(currentLang==='en'?(brands[k]?.en||brands[k]?.ar||k):(brands[k]?.ar||k))}</option>`).join('');const side=document.getElementById('sideCats');if(side)side.innerHTML=keys.map(k=>{const c=cats[k]||{};return `<button class="sideCat" onclick="setCat('${esc(k).replace(/'/g,"\'")}');toggleSideMenu()"><img src="${safeImg(c.image,LOGO)}" onerror="this.onerror=null;this.src='${LOGO}'"><b>${esc(currentLang==='en'?(c.en||c.ar||k):(c.ar||k))}</b><span>${countBy[k]||0}</span></button>`}).join('');const sideB=document.getElementById('sideBrands');if(sideB)sideB.innerHTML=Object.keys(brands).map(k=>{const b=brands[k]||{};const n=products.filter(p=>p.brand===k).length;return `<button class="sideCat" onclick="setBrand('${esc(k).replace(/'/g,"\'")}');toggleSideMenu()"><img src="${safeImg(b.image,LOGO)}" onerror="this.onerror=null;this.src='${LOGO}'"><b>${esc(currentLang==='en'?(b.en||b.ar||k):(b.ar||k))}</b><span>${n}</span></button>`}).join('')}
function setCat(c){document.getElementById('filter').value=c;const bf=document.getElementById('brandFilter');if(bf)bf.value='';document.getElementById('products').scrollIntoView({behavior:'smooth'});renderProducts()}
function setBrand(b){const bf=document.getElementById('brandFilter');if(bf)bf.value=b;const f=document.getElementById('filter');if(f)f.value='';document.getElementById('products').scrollIntoView({behavior:'smooth'});renderProducts()}
function variantList(p){return Array.isArray(p.variants)?p.variants.filter(v=>v&&String(v.name||'').trim()).map(v=>({name:String(v.name).trim(),stock:Math.max(0,Number(v.stock)||0)})):[]}
function totalStock(p){const vs=variantList(p);return vs.length?vs.reduce((a,v)=>a+v.stock,0):Math.max(0,Number(p.stock)||0)}
function selectedVariant(id){const el=document.getElementById('variant_'+id);return el?el.value:''}
function updateVariantCard(id){const p=products.find(x=>x.id===id);if(!p)return;const v=selectedVariant(id),stock=variantStock(p,v);const hint=document.getElementById('stockHint_'+id);if(hint)hint.textContent=`متوفر من اللون ${v}: ${stock}`;let low=document.getElementById('lowStock_'+id);if(stock>0&&stock<=3){if(!low){low=document.createElement('div');low.id='lowStock_'+id;low.className='lowStockAlert';const h=document.getElementById('stockHint_'+id);if(h)h.insertAdjacentElement('afterend',low)}low.textContent=`💕 استغلي الفرصة! آخر ${stock} قطع فقط 🌸`}else if(low)low.remove();const num=document.getElementById('qtyNum_'+id);const item=findCartItem(id,v);if(num)num.textContent=item?Number(item.qty)||0:0}
function renderVariantChooser(p){const vs=variantList(p);if(!vs.length)return '';return `<div class="variantBox"><div class="variantLabel">اختاري اللون</div><select class="variantSelect" id="variant_${p.id}" onchange="updateVariantCard(${p.id})">${vs.map(v=>`<option value="${esc(v.name)}" ${v.stock<=0?'disabled':''}>${esc(v.name)}${v.stock<=0?' — خلص':''} (${v.stock})</option>`).join('')}</select></div>`}

function shippingInfo(region){const map={westbank:{fee:20,ar:'الضفة الغربية',en:'West Bank'},jerusalem:{fee:35,ar:'القدس',en:'Jerusalem'},inside:{fee:70,ar:'الداخل',en:'Inside 1948'}};return map[region]||map.westbank}
function currentShipping(){const r=document.getElementById('shippingRegion')?.value||'westbank';return shippingInfo(r)}
function isOfferActive(p){return !!p.onSale&&Number(p.old)>Number(p.price)&&(!p.offerExpiry||new Date(p.offerExpiry+'T23:59:59').getTime()>=Date.now())}
function weeklyOrderDate(o){const raw=o?.createdAt||o?.timestamp||o?.date;const d=raw instanceof Date?raw:new Date(raw);return Number.isNaN(d.getTime())?null:d}
function isThisWeekOrder(o){const d=weeklyOrderDate(o);return !!d&&d.getTime()>=Date.now()-7*24*60*60*1000}
function salesMap(orders){const m={};(orders||[]).forEach(o=>(o.items||[]).forEach(it=>{const id=it.productId??it.id;if(id==null)return;m[String(id)]=(m[String(id)]||0)+(Number(it.qty)||0)}));return m}
function getTop5(){
  const eligible=products.filter(p=>totalStock(p)>0);
  const offers=eligible.filter(p=>isOfferActive(p));
  const pool=offers.length?offers:eligible;
  return [...pool].sort((a,b)=>{const am=a.top5?1:0,bm=b.top5?1:0;if(am!==bm)return bm-am;const ad=Number(a.old)>Number(a.price)?(Number(a.old)-Number(a.price))/Math.max(1,Number(a.old)):0;const bd=Number(b.old)>Number(b.price)?(Number(b.old)-Number(b.price))/Math.max(1,Number(b.old)):0;return bd-ad}).slice(0,5);
}
function getBestSellers(){
  const server=Array.isArray(window.LF_BEST_SELLERS)?window.LF_BEST_SELLERS:null;
  if(server){return server.map(x=>({p:products.find(p=>String(p.id)===String(x.productId)),qty:Number(x.quantity)||0})).filter(x=>x.p&&totalStock(x.p)>0).slice(0,5);}
  const all=load('lf_orders',[]).filter(o=>o.status!=='ملغي');
  const week=all.filter(isThisWeekOrder);
  const weeklyMap=salesMap(week), allMap=salesMap(all);
  const useMap=Object.keys(weeklyMap).length?weeklyMap:allMap;
  return Object.entries(useMap).map(([id,qty])=>({p:products.find(p=>String(p.id)===String(id)),qty})).filter(x=>x.p&&totalStock(x.p)>0).sort((a,b)=>b.qty-a.qty).slice(0,5);
}
function scrollFeature(id,dir){const el=document.getElementById(id);if(!el)return;const amount=Math.max(180,Math.round(el.clientWidth*.72));const before=el.scrollLeft;el.scrollBy({left:dir==='left'?-amount:amount,behavior:'smooth'});setTimeout(()=>{if(Math.abs(el.scrollLeft-before)<2){const max=Math.max(0,el.scrollWidth-el.clientWidth);if(max>8)el.scrollLeft=dir==='left'?Math.max(0,before-amount):Math.min(max,before+amount)}},450);}
const ACCOUNT_KEY='lf_account', FAV_KEY='lf_favorites';
function getAccount(){
  const account=load(ACCOUNT_KEY,null);
  if(!account)return null;
  const users=load('lf_users',[]);
  if(!Array.isArray(users)||!users.length)return account;
  let user=null;
  if(account.id!=null) user=users.find(u=>String(u.id||'')===String(account.id));
  if(!user) user=users.find(u=>u.type===account.type&&String(u.contact||'').trim().toLowerCase()===String(account.contact||'').trim().toLowerCase());
  if(!user)return account;
  const synced={...account,...user,password:account.password||user.password};
  if(JSON.stringify(synced)!==JSON.stringify(account)) save(ACCOUNT_KEY,synced);
  return synced;
}

function bindFeatureCarousel(el){
  if(!el||el.dataset.carouselBound==='1')return;
  el.dataset.carouselBound='1';
  el.style.touchAction='pan-x pan-y';
  let down=false,startX=0,startScroll=0,moved=false;
  const start=e=>{const p=e.touches?e.touches[0]:e;down=true;moved=false;startX=p.clientX;startScroll=el.scrollLeft;el.classList.add('dragging');};
  const move=e=>{if(!down)return;const p=e.touches?e.touches[0]:e,dx=p.clientX-startX;if(Math.abs(dx)>7)moved=true;if(moved){el.scrollLeft=startScroll-dx;if(e.cancelable)e.preventDefault();}};

async function lfSyncMe(){if(!lfToken())return null;try{const d=await lfFetch('/api/me');if(d.user){const old=load(ACCOUNT_KEY,null)||{};const a={...old,...d.user,type:old.type||(d.user.email?'email':'whatsapp')};save(ACCOUNT_KEY,a);registerUserRecord(a);return a}}catch(e){if(e.status===401)localStorage.removeItem(LF_TOKEN_KEY)}return null}
async function lfSyncMyOrders(){if(!lfToken())return;try{const d=await lfFetch('/api/orders/my');if(Array.isArray(d.orders))save('lf_orders',d.orders.map(o=>({id:o.id,createdAt:o.created_at,date:new Date(o.created_at).toLocaleString('ar-PS'),name:o.customer_name,phone:o.customer_contact,address:o.customer_address,total:o.total,subtotal:o.subtotal,couponDiscount:o.discount||0,loyaltyDiscount:o.loyalty_discount||0,pointsRedeemed:o.points_redeemed||0,shippingFee:o.shipping||0,packagingTotal:o.packaging||0,status:o.status,inventoryState:o.inventory_state,items:(o.items||[]).map(i=>({productId:i.product_id,variant:i.variant_name||'',qty:i.quantity,name:i.name_snapshot,price:i.price_snapshot}))})))}catch(e){console.warn('API orders unavailable',e.message)}}
async function saveWhatsAppOptIn(){const v=!!document.getElementById('waOptIn')?.checked;try{const d=await lfFetch('/api/me',{method:'PATCH',body:JSON.stringify({whatsapp_opt_in:v})});const a={...load(ACCOUNT_KEY,{}),...d.user};save(ACCOUNT_KEY,a);renderAccountContent();alert(v?'تم تفعيل رسائل واتساب اللطيفة 🌸':'تم إيقاف رسائل واتساب.')}catch(e){alert('تعذر حفظ تفضيل واتساب: '+e.message)}}
async function lfCartHeartbeat(){if(!lfToken()||!Array.isArray(cart)||!cart.length)return;try{await lfFetch('/api/cart/heartbeat',{method:'POST',body:JSON.stringify({items:cart.map(i=>({productId:String(i.productId??i.id),variantName:i.variant||null,quantity:Number(i.qty)||0}))})})}catch(e){console.warn('cart heartbeat',e.message)}}
async function lfClearCartHeartbeat(){if(!lfToken())return;try{await lfFetch('/api/cart/heartbeat',{method:'DELETE'})}catch(e){}}
async function lfRegisterOrLogin(a){try{const d=await lfFetch('/api/auth/register',{method:'POST',body:JSON.stringify({name:a.name,contact:a.contact,email:a.type==='email'?a.contact:'',password:a.password,gender:a.gender,age:a.age})});localStorage.setItem(LF_TOKEN_KEY,d.token);return d.user}catch(e){if(e.status!==409)throw e;const d=await lfFetch('/api/auth/login',{method:'POST',body:JSON.stringify({contact:a.contact,password:a.password})});localStorage.setItem(LF_TOKEN_KEY,d.token);return d.user}}
const lfOldSaveAccount=saveAccount;
saveAccount=async function(){const name=document.getElementById('accountName')?.value.trim(),contact=document.getElementById('accountContact')?.value.trim(),gender=document.getElementById('accountGender')?.value||'female',age=Math.max(13,Math.min(120,Number(document.getElementById('accountAge')?.value)||0)),password=document.getElementById('accountPassword')?.value||'';if(!name||!contact||!age||!password)return alert('أدخلي الاسم والجنس والعمر ووسيلة التواصل وكلمة المرور');if(password.length<8)return alert('كلمة المرور يجب أن تكون 8 أحرف/أرقام على الأقل');if(accountMode==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact))return alert('أدخلي بريدًا إلكترونيًا صحيحًا');if(accountMode==='whatsapp'&&!validMobile(contact))return alert('أدخلي رقم واتساب صحيح');const old=load(ACCOUNT_KEY,null);const a={name,contact,type:accountMode,gender,age,password,id:old?.id||Date.now(),createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};try{let u=await lfRegisterOrLogin(a);if(lfToken()){try{const d=await lfFetch('/api/me',{method:'PATCH',body:JSON.stringify({name,contact,email:accountMode==='email'?contact:'',gender,age})});u=d.user}catch(e){if(e.status!==409)throw e}}const safe={...a,...u};delete safe.password;save(ACCOUNT_KEY,safe);registerUserRecord(safe);await lfSyncMyOrders();await lfCartHeartbeat();renderAccountContent();updateAccountBadge();alert('تم حفظ الحساب وتحديثه على الخادم 🌸')}catch(e){alert('تعذر حفظ الحساب: '+e.message)}};
const lfOldLogout=logoutAccount;logoutAccount=function(){localStorage.removeItem(LF_TOKEN_KEY);lfOldLogout()};
const lfOldPlaceOrder=placeOrder;
placeOrder=async function(){if(!cart.length)return alert('السلة فارغة');const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),city=document.getElementById('city').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!city||!address)return alert('يرجى تعبئة الاسم والجوال والمدينة والعنوان');if(!validMobile(phone))return alert('أدخل رقم جوال صحيح');const pay=document.querySelector('input[name="pay"]:checked')?.value||'cod',items=makeOrderItems(pay);if(!items.length)return alert('تعذر تجهيز المنتجات');let userId=null;if(lfToken()){const me=await lfSyncMe();userId=me?.id||null;await lfLoadLoyalty()}const totals=getCartTotals(pay),a=load(ACCOUNT_KEY,null);try{const d=await lfFetch('/api/orders',{method:'POST',body:JSON.stringify({userId,customer:{name,contact:normalizePhone(phone),address:`${city} - ${address}`,gender:a?.gender,age:a?.age},paymentMethod:pay,shipping:totals.shippingFee,packaging:totals.packagingTotal,couponCode:totals.coupon?.code||null,pointsToRedeem:totals.pointsRedeemed||0,items:items.map(i=>({productId:String(i.productId),variantName:i.variant||null,quantity:i.qty}))})});cart=[];save('lf_cart',cart);await lfClearCartHeartbeat();couponCode='';localStorage.removeItem('lf_coupon');clearCheckoutDraft();await lfSyncProducts();await lfSyncMyOrders();renderCart();updateCount();document.getElementById('drawer').style.display='block';document.getElementById('checkout').innerHTML=`<div class="success"><b>تم استلام طلبك بنجاح 🌸</b><br>رقم الطلب: #${d.orderId}<br>السلة أصبحت فارغة.</div>`}catch(e){alert('تعذر تنفيذ الطلب: '+e.message);await lfSyncProducts()}};
async function lfSyncStoreSettings(){
  try{const d=await lfFetch('/api/settings'); const st=d.settings||{};
    if(st.cats&&typeof st.cats==='object'){cats=st.cats;save('lf_cats',cats)}
    if(st.brands&&typeof st.brands==='object'){brands=st.brands;save('lf_brands',brands)}
    if(st.hero&&typeof st.hero==='object'){heroSettings=st.hero;save('lf_hero',heroSettings)}
    if(Array.isArray(st.hero_slides))save('lf_hero_slides',st.hero_slides);
    if(st.hero_text_style&&typeof st.hero_text_style==='object')save('lf_hero_text_style',st.hero_text_style);
    if(st.social_links&&typeof st.social_links==='object')save('lf_social_links',st.social_links);
    if(Array.isArray(st.packaging_options))save('lf_packaging_options',st.packaging_options);
    renderHero();renderHeroSlider();renderCats();renderProducts();renderFeatureSections();
  }catch(e){console.warn('API settings unavailable',e.message)}
}
const lfOldJoinWaitlist=joinWaitlist;
joinWaitlist=async function(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const name=prompt(currentLang==='en'?'Your name:':'اسمك:');if(!name)return;const phone=prompt(currentLang==='en'?'WhatsApp number:':'رقم واتسابك:');if(!phone)return;try{await lfFetch('/api/waitlist',{method:'POST',body:JSON.stringify({productId:String(id),contact:normalizePhone(phone)})});alert(currentLang==='en'?'You have been added to the availability list.':'💕 تم تسجيلك في قائمة التوفر. سنراسلك عند توفره 🌸')}catch(e){if(e.status===409)alert('أنتِ مسجلة مسبقًا لهذا المنتج');else{console.warn(e);lfOldJoinWaitlist(id)}}};

setInterval(()=>lfCartHeartbeat(),30*60*1000);
window.addEventListener('DOMContentLoaded',async()=>{await lfSyncStoreSettings();await lfSyncMe();await lfLoadLoyalty();await lfSyncProducts();await lfSyncFeatured();await lfSyncMyOrders();renderAccountContent();updateAccountBadge();restartFeatureAuto()});
</script>
</html>
